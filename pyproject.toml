[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "calolab-reco"
version = "0.1.0"
description = "A bounded study of calorimeter reconstruction and reusable representations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
cpu = ["torch==2.7.1"]
cuda = ["torch==2.7.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
